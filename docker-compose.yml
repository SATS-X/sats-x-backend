services:
  postgres:
    image: postgres:16-alpine
    container_name: attendance-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpw
      POSTGRES_DB: attendance_system
    ports:
      # Cổng 15432 để không đụng Postgres có sẵn trên máy.
      - '15432:5432'
    volumes:
      - attendance_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d attendance_system']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  attendance_pg_data:
